<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>পেমেন্ট স্ট্যাটাস | পুনর্মিলনী ২০২৬</title><style>body{font-family:system-ui,"Noto Sans Bengali",sans-serif;margin:0;background:#f4f8ee;color:#173b2a}.box{max-width:640px;margin:10vh auto;background:white;padding:28px;border-radius:18px;box-shadow:0 14px 45px #1232}a{color:#087443;font-weight:bold}</style></head><body><main class="box"><h1>পুনর্মিলনী ২০২৬</h1><h2 id="title">পেমেন্ট স্ট্যাটাস যাচাই হচ্ছে</h2><p id="message">গেটওয়ের প্রতিক্রিয়া যাচাই করে ডেটাবেস আপডেট করা হচ্ছে।</p><p><a href="/">রেজিস্ট্রেশন পেজে ফিরুন</a></p></main><script>const q=new URLSearchParams(location.search),s=q.get('status');const map={paid:['পেমেন্ট সফল','আপনার পেমেন্ট যাচাই হয়েছে। রেজিস্ট্রেশন নিশ্চিত হয়েছে।'],review:['পেমেন্ট যাচাইাধীন','পেমেন্টটি আয়োজক কমিটি যাচাই করবে।'],verification_pending:['যাচাই চলছে','এখনো চূড়ান্ত নিশ্চিতকরণ পাওয়া যায়নি। কিছুক্ষণ পর অ্যাডমিনের সঙ্গে যোগাযোগ করুন।'],failed:['পেমেন্ট ব্যর্থ','পেমেন্ট সম্পন্ন হয়নি। আবার চেষ্টা করুন অথবা আয়োজকদের সঙ্গে যোগাযোগ করুন।'],cancelled:['পেমেন্ট বাতিল','আপনি পেমেন্ট বাতিল করেছেন।'],undefined:['স্ট্যাটাস পাওয়া যায়নি','পেমেন্ট স্ট্যাটাস নিশ্চিত নয়।']};const m=map[s]||map.undefined;document.getElementById('title').textContent=m[0];document.getElementById('message').textContent=m[1];</script></body></html>
